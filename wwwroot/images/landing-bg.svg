<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="desk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c8d6e5"/>
      <stop offset="40%" style="stop-color:#dfe6ed"/>
      <stop offset="100%" style="stop-color:#b0bec5"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#desk)"/>
  <!-- Notebook -->
  <g filter="url(#blur)" opacity="0.7">
    <rect x="280" y="420" width="420" height="520" rx="8" fill="#f5f0e8" transform="rotate(-8 490 680)"/>
    <line x1="340" y1="500" x2="620" y2="480" stroke="#d0c8bc" stroke-width="2"/>
    <line x1="340" y1="560" x2="620" y2="540" stroke="#d0c8bc" stroke-width="2"/>
    <line x1="340" y1="620" x2="580" y2="605" stroke="#d0c8bc" stroke-width="2"/>
  </g>
  <!-- Chart paper -->
  <g filter="url(#blur)" opacity="0.65">
    <rect x="720" y="380" width="380" height="280" rx="4" fill="#ffffff" transform="rotate(5 910 520)"/>
    <polyline points="760,580 820,520 880,540 940,460 1000,480 1060,400" fill="none" stroke="#5c6bc0" stroke-width="3"/>
    <rect x="780" y="600" width="40" height="60" fill="#90caf9" transform="rotate(5 910 520)"/>
    <rect x="840" y="580" width="40" height="80" fill="#64b5f6" transform="rotate(5 910 520)"/>
    <rect x="900" y="590" width="40" height="70" fill="#42a5f5" transform="rotate(5 910 520)"/>
  </g>
  <!-- Pens -->
  <g filter="url(#blur)" opacity="0.6">
    <rect x="520" y="780" width="180" height="12" rx="6" fill="#37474f" transform="rotate(-15 610 786)"/>
    <rect x="560" y="820" width="160" height="10" rx="5" fill="#1565c0" transform="rotate(20 640 825)"/>
  </g>
  <!-- Tablet -->
  <g filter="url(#blur)" opacity="0.55">
    <rect x="1100" y="650" width="240" height="180" rx="12" fill="#263238"/>
    <rect x="1115" y="665" width="210" height="150" rx="4" fill="#eceff1"/>
  </g>
  <rect width="1920" height="1080" fill="rgba(255,255,255,0.08)"/>
</svg>
